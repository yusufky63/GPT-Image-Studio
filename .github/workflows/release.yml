name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "GPT-Image-Studio" --collect-submodules keyring.backends main.py

      - name: SHA256
        shell: powershell
        run: |
          $hash=(Get-FileHash "dist/GPT-Image-Studio.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  GPT-Image-Studio.exe" | Out-File -Encoding ascii "dist/SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPT-Image-Studio-Windows
          path: |
            dist/GPT-Image-Studio.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GPT-Image-Studio.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
